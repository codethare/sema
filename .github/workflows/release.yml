name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: sema

jobs:
  build:
    name: Build and upload
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: x86_64-unknown-linux-musl

      - name: Build (release, musl)
        run: cargo build --release --target x86_64-unknown-linux-musl

      - name: Package binary
        run: |
          cd target/x86_64-unknown-linux-musl/release
          tar czf "${BINARY_NAME}-x86_64-linux-musl.tar.gz" "${BINARY_NAME}"
          sha256sum "${BINARY_NAME}-x86_64-linux-musl.tar.gz" > "${BINARY_NAME}-x86_64-linux-musl.tar.gz.sha256"

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/x86_64-unknown-linux-musl/release/sema-x86_64-linux-musl.tar.gz
            target/x86_64-unknown-linux-musl/release/sema-x86_64-linux-musl.tar.gz.sha256
