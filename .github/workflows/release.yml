name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: sema
  RUST_CACHE_PREFIX: v1

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - armv7-unknown-linux-musleabihf
          - i686-unknown-linux-musl

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1
        with:
          target: ${{ matrix.target }}
          components: clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          # Shared prefix with ci.yml; key per target so cross-compiled artifacts don't collide
          key: ${{ env.RUST_CACHE_PREFIX }}-${{ matrix.target }}-${{ github.sha }}

      # x86_64 builds natively; other targets cross-compile via cross+podman
      - name: Install cross (non-x86 targets)
        if: matrix.target != 'x86_64-unknown-linux-musl'
        uses: taiki-e/install-action@e49978b799e49ff429d162b7a30601a569ab6538 # v2
        with:
          tool: cross

      - name: Check (x86_64 only)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo test

      - name: Build (native)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.target != 'x86_64-unknown-linux-musl'
        run: cross build --release --target ${{ matrix.target }}

      - name: Package
        run: |
          cd "target/${{ matrix.target }}/release"
          ARCH=$(echo '${{ matrix.target }}' | sed 's/-unknown-/-/')
          tar czf "${BINARY_NAME}-${ARCH}.tar.gz" "${BINARY_NAME}"
          sha256sum "${BINARY_NAME}-${ARCH}.tar.gz" > "${BINARY_NAME}-${ARCH}.tar.gz.sha256"
          echo "ARCH=${ARCH}" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ env.ARCH }}
          path: target/${{ matrix.target }}/release/sema-*.tar.gz*
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          path: assets
          merge-multiple: true

      - name: List assets
        run: ls -lh assets/

      - name: Install cosign
        uses: sigstore/cosign-installer@c56c2d3e59e4281cc41dea2217323ba5694b171e # v3.8.0

      - name: Sign artifacts with cosign (keyless OIDC)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          for file in assets/*; do
            [[ -f "$file" ]] || continue
            # Skip signature/cert files from previous runs (idempotency).
            case "$file" in
              *.sig|*.pem) continue ;;
            esac
            echo "signing: $file"
            cosign sign-blob \
              --output-signature "${file}.sig" \
              --output-certificate "${file}.pem" \
              --yes \
              "$file"
          done

      - name: Create Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          files: |
            assets/*
            assets/*.sig
            assets/*.pem
          generate_release_notes: true
          fail_on_unmatched_files: true
