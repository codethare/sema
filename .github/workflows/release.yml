name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: sema

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - armv7-unknown-linux-musleabihf
          - i686-unknown-linux-musl

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1
        with:
          target: ${{ matrix.target }}
          components: clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          # key per target so cross-compiled artifacts don't collide
          key: ${{ matrix.target }}

      # x86_64 builds natively; other targets cross-compile via cross+podman
      - name: Install cross (non-x86 targets)
        if: matrix.target != 'x86_64-unknown-linux-musl'
        uses: taiki-e/install-action@e49978b799e49ff429d162b7a30601a569ab6538 # v2
        with:
          tool: cross

      - name: Check (x86_64 only)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo test

      - name: Build (native)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.target != 'x86_64-unknown-linux-musl'
        run: cross build --release --target ${{ matrix.target }}

      - name: Package
        run: |
          cd "target/${{ matrix.target }}/release"
          ARCH=$(echo '${{ matrix.target }}' | sed 's/-unknown-/-/')
          tar czf "${BINARY_NAME}-${ARCH}.tar.gz" "${BINARY_NAME}"
          sha256sum "${BINARY_NAME}-${ARCH}.tar.gz" > "${BINARY_NAME}-${ARCH}.tar.gz.sha256"
          echo "ARCH=${ARCH}" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ env.ARCH }}
          path: target/${{ matrix.target }}/release/sema-*.tar.gz*
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          path: assets
          merge-multiple: true

      - name: List assets
        run: ls -lh assets/

      - name: Create Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          files: assets/*
          generate_release_notes: true
          fail_on_unmatched_files: true
