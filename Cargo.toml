[package]
name = "sema"
version = "0.0.2"
edition = "2024"
description = "Linux system resource monitor with desktop notifications. Monitors CPU, memory, swap, battery, temperature, network, and time."
authors = ["codethare"]
license = "MIT"
repository = "https://github.com/codethare/sema"

[dependencies]
sysinfo = "0.33"
notify-rust = "4.11"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
signal-hook = "0.3"
