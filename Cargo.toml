[package]
name = "sema"
version = "0.0.6"
edition = "2024"
description = "Linux system resource monitor with desktop notifications. Monitors CPU, memory, swap, battery, temperature, network, and time."
authors = ["codethare"]
license = "MIT"
repository = "https://github.com/codethare/sema"

[dependencies]
sysinfo = "0.39"
notify-rust = "4.17"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
toml = "1.1"
signal-hook = "0.4"
clap = { version = "4", features = ["derive"] }
single-instance = "0.3"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
